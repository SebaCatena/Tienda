<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de ropa con carrito de compras. Proyecto demo de frontend con HTML, CSS y JavaScript.">
  <meta name="theme-color" content="#000814">
  <title>Tienda | Catálogo de ropa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav container">
      <a href="#" class="logo"><span>T</span>ienda</a>

      <button type="button" id="cart-icon" aria-label="Abrir carrito" aria-expanded="false" aria-controls="cart">
        <i class="bx bx-shopping-bag" aria-hidden="true"></i>
      </button>

      <aside class="cart" id="cart" aria-label="Carrito de compras">
        <h2 class="cart-title">Tu carrito</h2>

        <button type="button" id="cart-close" aria-label="Cerrar carrito">
          <i class="bx bx-x" aria-hidden="true"></i>
        </button>

        <div class="cart-content" aria-live="polite"></div>

        <div class="total">
          <div class="total-title">Total</div>
          <div class="total-price" aria-live="polite">$0</div>
        </div>

        <button type="button" class="btn-buy">Comprar ahora</button>
      </aside>
    </div>
  </header>

  <main>
    <section class="shop container">
      <h2 class="section-title">Nuestros productos</h2>

      <div class="shop-content">
        <article class="product-box">
          <img src="img/Abrigo.jpg" alt="Campera de abrigo" class="product-img" width="600" height="600" loading="eager" decoding="async">
          <h2 class="product-title">Campera</h2>
          <span class="product-price">$1000</span>
          <button type="button" class="add-cart" aria-label="Agregar Campera al carrito">
            <i class="bx bx-shopping-bag" aria-hidden="true"></i>
          </button>
        </article>

        <article class="product-box">
          <img src="img/Buzo.jpg" alt="Buzo con capucha" class="product-img" width="600" height="600" loading="lazy" decoding="async">
          <h2 class="product-title">Buzo</h2>
          <span class="product-price">$100</span>
          <button type="button" class="add-cart" aria-label="Agregar Buzo al carrito">
            <i class="bx bx-shopping-bag" aria-hidden="true"></i>
          </button>
        </article>

        <article class="product-box">
          <img src="img/Camisa.jpg" alt="Camisa de vestir" class="product-img" width="600" height="600" loading="lazy" decoding="async">
          <h2 class="product-title">Camisa</h2>
          <span class="product-price">$50</span>
          <button type="button" class="add-cart" aria-label="Agregar Camisa al carrito">
            <i class="bx bx-shopping-bag" aria-hidden="true"></i>
          </button>
        </article>

        <article class="product-box">
          <img src="img/ConjunHombre.jpg" alt="Conjunto deportivo de hombre" class="product-img" width="600" height="600" loading="lazy" decoding="async">
          <h2 class="product-title">Conjunto Hombre</h2>
          <span class="product-price">$2000</span>
          <button type="button" class="add-cart" aria-label="Agregar Conjunto Hombre al carrito">
            <i class="bx bx-shopping-bag" aria-hidden="true"></i>
          </button>
        </article>

        <article class="product-box">
          <img src="img/Conjunto.jpg" alt="Conjunto deportivo" class="product-img" width="600" height="600" loading="lazy" decoding="async">
          <h2 class="product-title">Conjunto</h2>
          <span class="product-price">$100</span>
          <button type="button" class="add-cart" aria-label="Agregar Conjunto al carrito">
            <i class="bx bx-shopping-bag" aria-hidden="true"></i>
          </button>
        </article>

        <article class="product-box">
          <img src="img/Jean.jpg" alt="Pantalón de jean" class="product-img" width="600" height="600" loading="lazy" decoding="async">
          <h2 class="product-title">Jeans</h2>
          <span class="product-price">$1500</span>
          <button type="button" class="add-cart" aria-label="Agregar Jeans al carrito">
            <i class="bx bx-shopping-bag" aria-hidden="true"></i>
          </button>
        </article>

        <article class="product-box">
          <img src="img/Remera.jpg" alt="Remera de algodón" class="product-img" width="600" height="600" loading="lazy" decoding="async">
          <h2 class="product-title">Remera</h2>
          <span class="product-price">$15</span>
          <button type="button" class="add-cart" aria-label="Agregar Remera al carrito">
            <i class="bx bx-shopping-bag" aria-hidden="true"></i>
          </button>
        </article>

        <article class="product-box">
          <img src="img/Zapatilla.jpg" alt="Zapatillas urbanas" class="product-img" width="600" height="600" loading="lazy" decoding="async">
          <h2 class="product-title">Zapatilla</h2>
          <span class="product-price">$1200</span>
          <button type="button" class="add-cart" aria-label="Agregar Zapatilla al carrito">
            <i class="bx bx-shopping-bag" aria-hidden="true"></i>
          </button>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Demo de catálogo · El carrito es simulado y no procesa pagos reales.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
